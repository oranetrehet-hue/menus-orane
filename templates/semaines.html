{% extends "base.html" %}
{% block title %}Semaines précédentes – Menus{% endblock %}

{% block content %}
<header class="tete">
  <div class="tete-textes">
    <h1 class="titre-ecran">Semaines précédentes</h1>
  </div>
</header>

<div class="carte liste">
  {% for m in archives %}
  <a class="ligne-lien" href="semaines/{{ m.slug }}.html">
    <span>{{ m.label|capitalize }}</span>
    <span class="meta">{{ m.recettes|length }} recettes</span>
  </a>
  {% else %}
  <p class="note">Pas encore d'autre semaine.</p>
  {% endfor %}
</div>
{% endblock %}
