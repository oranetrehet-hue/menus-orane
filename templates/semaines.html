{% extends "base.html" %}
{% block title %}Semaines précédentes – Menus{% endblock %}

{% block content %}
<header class="tete">
  <div class="tete-textes">
    <p class="surtitre">Archives</p>
    <h1 class="titre-ecran">Semaines précédentes</h1>
  </div>
</header>

<div class="carte liste">
  {% for m in archives %}
  <a class="ligne-lien" href="semaines/{{ m.slug }}.html">Semaine {{ m.week }} · {{ m.label }}
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
  {% else %}
  <p class="note">Pas encore d'autre semaine.</p>
  {% endfor %}
</div>
{% endblock %}
