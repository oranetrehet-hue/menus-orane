{% extends "base.html" %}
{% block title %}Semaine {{ menu.week }} – Menus{% endblock %}

{% block content %}
<header class="tete">
  <div class="tete-textes">
    <a class="date-du-jour lien-discret" href="{{ root }}semaines.html">Semaines précédentes</a>
    <h1 class="titre-ecran">{{ menu.label|capitalize }}</h1>
  </div>
</header>

<div class="grille-semaine">
  {% for r in menu.recettes %}
  <a class="tuile" href="{{ root }}recettes/{{ r.page }}">
    {% if r.photo %}
    <img class="tuile-photo" src="{{ r.photo }}" alt="" loading="lazy" referrerpolicy="no-referrer">
    {% else %}
    <span class="tuile-photo tuile-sans-photo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1.5-3 4-3 7s1 4 3 4"></path></svg></span>
    {% endif %}
    <span class="tuile-nom">{{ r.nom }}</span>
    <span class="tuile-midi">{{ r.meta }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
